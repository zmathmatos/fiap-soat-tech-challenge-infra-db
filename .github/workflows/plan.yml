name: Terraform Plan

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  TF_WORKING_DIR: terraform
  AWS_REGION: us-east-1

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan
        env:
          TF_VAR_environment: ${{ vars.ENVIRONMENT }}
          TF_VAR_rds_database_port: ${{ secrets.RDS_DATABASE_PORT }}
          TF_VAR_rds_database_name: ${{ secrets.RDS_DATABASE_NAME }}
          TF_VAR_rds_master_username: ${{ secrets.DB_USER }}
          TF_VAR_rds_master_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_rabbitmq_password: ${{ secrets.RABBITMQ_PASSWORD }}
          TF_VAR_mongodb_root_password: ${{ secrets.MONGODB_ROOT_PASSWORD }}
          TF_VAR_mongodb_app_password: ${{ secrets.MONGODB_APP_PASSWORD }}
          TF_VAR_eks_cluster_role_arn: ${{ secrets.EKS_CLUSTER_ROLE_ARN }}
          TF_VAR_eks_node_group_role_arn: ${{ secrets.EKS_NODE_GROUP_ROLE_ARN }}
          TF_VAR_eks_access_principal_arn: ${{ secrets.EKS_ACCESS_PRINCIPAL_ARN }}
          TF_VAR_newrelic_enabled: ${{ vars.NEWRELIC_ENABLED || 'true' }}
          TF_VAR_newrelic_account_id: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          TF_VAR_newrelic_api_key: ${{ secrets.NEW_RELIC_API_KEY }}
          TF_VAR_newrelic_license_key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
